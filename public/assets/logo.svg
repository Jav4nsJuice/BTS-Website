<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Circuit board pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.5" fill="#a0aec0" opacity="0.4"/>
      <circle cx="35" cy="15" r="1.5" fill="#718096" opacity="0.3"/>
      <circle cx="15" cy="35" r="1.5" fill="#718096" opacity="0.3"/>
      <rect x="5" y="4" width="30" height="1" fill="#a0aec0" opacity="0.2"/>
      <rect x="5" y="35" width="30" height="1" fill="#a0aec0" opacity="0.2"/>
      <rect x="4" y="5" width="1" height="30" fill="#a0aec0" opacity="0.2"/>
      <rect x="35" y="5" width="1" height="30" fill="#a0aec0" opacity="0.2"/>
      <circle cx="20" cy="20" r="2" fill="#718096" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#f8f9fa"/>
  
  <!-- Circuit board pattern overlay -->
  <rect width="200" height="80" fill="url(#circuitPattern)"/>
  
  <!-- BTS Acronym -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="700" 
        fill="#6b46c1" text-anchor="middle" letter-spacing="3">BTS</text>
  
  <!-- Business Tech Solutions text -->
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="8" font-weight="500" 
        fill="#6b46c1" text-anchor="middle" letter-spacing="1.5">BUSINESS</text>
  <text x="100" y="68" font-family="Arial, sans-serif" font-size="8" font-weight="500" 
        fill="#6b46c1" text-anchor="middle" letter-spacing="1.5">TECH SOLUTIONS</text>
</svg>

